name: Build, Push & Deploy (GKE)
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s-configmaps/**'
permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="asia-southeast2-docker.pkg.dev/portalpasti/portalpasti-registry/ahm-dashboard"
          docker build --platform=linux/amd64 \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .

      - name: Push image
        run: |
          IMAGE="asia-southeast2-docker.pkg.dev/portalpasti/portalpasti-registry/ahm-dashboard"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: portalpasti-gke
          location: asia-southeast2-a

      - name: Deploy (kubectl set image)
        run: |
          IMAGE="asia-southeast2-docker.pkg.dev/portalpasti/portalpasti-registry/ahm-dashboard:${{ needs.build-push.outputs.image_tag }}"
          kubectl set image deployment/ahm-dashboard \
            ahm-dashboard=$IMAGE \
            -n default